<style>
/* ============================================================
   THEME SYSTEM
   ============================================================ */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", Menlo, monospace;

  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-soft: rgba(59,130,246,.15);
  --success: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --radius: 8px;
  --radius-sm: 5px;
  --radius-lg: 12px;

  --header-h: 52px;
  --status-h: 26px;
  --tab-h: 36px;
  --sidebar-w: 260px;
}

html[data-theme="dark"] {
  --bg-0: #0b0d12;
  --bg-1: #12141a;
  --bg-2: #171a21;
  --bg-3: #1e222b;
  --bg-hover: #242833;
  --bg-active: #2b3040;
  --bg-elev: #171a21;
  --border: #262b36;
  --border-soft: #1e222b;
  --text: #e6ebf2;
  --text-2: #97a3b5;
  --text-3: #5c687a;
  --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --editor-bg: #12141a;
  --term-bg: #06080c;
  --scroll-thumb: #2c323d;
}

html[data-theme="light"] {
  --bg-0: #f6f7f9;
  --bg-1: #ffffff;
  --bg-2: #ffffff;
  --bg-3: #f3f4f6;
  --bg-hover: #eef0f4;
  --bg-active: #e2e6ee;
  --bg-elev: #ffffff;
  --border: #e2e5eb;
  --border-soft: #eef0f4;
  --text: #1a1f2b;
  --text-2: #566075;
  --text-3: #8b93a5;
  --shadow-lg: 0 12px 40px rgba(20,30,60,.15);
  --shadow-sm: 0 2px 8px rgba(20,30,60,.08);
  --editor-bg: #ffffff;
  --term-bg: #0b0d12;
  --scroll-thumb: #c8cdd8;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-0);
  color: var(--text);
  overflow: hidden;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  transition: background .15s ease, color .15s ease;
}
button { font-family: inherit; }
a { color: var(--accent); }
kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  color: var(--text-2);
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr var(--status-h);
  height: 100vh;
}

/* HEADER */
header.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  z-index: 40;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -.2px;
  white-space: nowrap;
}
.brand-logo {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(59,130,246,.35);
}
.brand-logo svg { width: 16px; height: 16px; }
.brand small { color: var(--text-3); font-weight: 500; margin-left: 2px; }

.topbar-actions { display: flex; gap: 8px; margin-left: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .06s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-soft); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn.icon-only { padding: 0; width: 34px; justify-content: center; }

.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger  { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.success { background: var(--success); border-color: var(--success); color: #fff; }
.btn.ghost   { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-hover); color: var(--text); }

.topbar-spacer { flex: 1; }

/* MAIN WORKSPACE */
.workspace {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 0;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.sidebar-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-3);
}
.sidebar-section .toolbar { display: flex; gap: 3px; }
.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-3);
  background: transparent;
  border: none;
  transition: background .12s, color .12s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; }

.file-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
  min-height: 0;
}
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-2);
  user-select: none;
  transition: background .1s, color .1s;
}
.file-item:hover { background: var(--bg-hover); color: var(--text); }
.file-item.active { background: var(--accent-soft); color: var(--text); }
.file-item.active .file-name { color: var(--accent); font-weight: 600; }
.file-item .file-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-item svg.file-icon { width: 14px; height: 14px; color: var(--text-3); flex-shrink: 0; }
.file-item.active svg.file-icon { color: var(--accent); }
.file-item .file-more {
  opacity: 0;
  display: flex; gap: 2px;
  transition: opacity .12s;
}
.file-item:hover .file-more, .file-item.active .file-more { opacity: 1; }
.file-item .file-more .icon-btn { width: 22px; height: 22px; }
.file-item .file-more .icon-btn svg { width: 12px; height: 12px; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-3);
  font-size: 12.5px;
  line-height: 1.6;
}
.empty-state svg { width: 32px; height: 32px; opacity: .35; margin-bottom: 10px; }

.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-footer svg { width: 12px; height: 12px; flex-shrink: 0; }

/* MAIN AREA */
.main-area {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--editor-bg);
}

/* TABS */
.tabs-bar {
  display: flex;
  align-items: stretch;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  height: var(--tab-h);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-size: 12.5px;
  color: var(--text-2);
  border-right: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  max-width: 220px;
  position: relative;
  transition: background .1s, color .1s;
  border-bottom: 2px solid transparent;
}
.tab:hover { background: var(--bg-hover); color: var(--text); }
.tab.active {
  background: var(--editor-bg);
  color: var(--text);
  border-bottom-color: var(--accent);
}
.tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
.tab .tab-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn); flex-shrink: 0;
  display: none;
}
.tab.dirty .tab-dot { display: block; }
.tab .tab-close {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--text-3);
  opacity: 0;
  transition: opacity .1s, background .1s, color .1s;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
.tab .tab-close:hover { background: var(--bg-active); color: var(--text); }
.tab .tab-close svg { width: 12px; height: 12px; }

/* EDITOR */
.editor-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
#editor-host, .CodeMirror {
  height: 100% !important;
  font-family: var(--font-mono) !important;
  font-size: 13.5px !important;
  line-height: 1.55 !important;
}
.CodeMirror {
  background: var(--editor-bg) !important;
  color: var(--text) !important;
}
.CodeMirror-gutters { background: var(--editor-bg) !important; border-right: 1px solid var(--border-soft) !important; }
.CodeMirror-linenumber { color: var(--text-3) !important; }
.CodeMirror-cursor { border-left-color: var(--accent) !important; border-left-width: 2px !important; }
.CodeMirror-selected { background: var(--accent-soft) !important; }
.CodeMirror-focused .CodeMirror-selected { background: rgba(59,130,246,.28) !important; }
.CodeMirror-activeline-background { background: rgba(59,130,246,.06) !important; }
.CodeMirror-matchingbracket {
  color: var(--accent) !important;
  background: var(--accent-soft) !important;
  font-weight: bold;
}
.CodeMirror-nonmatchingbracket { color: var(--danger) !important; }
.cm-s-default .cm-keyword  { color: #c792ea; }
.cm-s-default .cm-def      { color: #82aaff; }
.cm-s-default .cm-variable { color: var(--text); }
.cm-s-default .cm-variable-2 { color: #f78c6c; }
.cm-s-default .cm-property { color: #7fdbca; }
.cm-s-default .cm-operator { color: #89ddff; }
.cm-s-default .cm-number   { color: #f78c6c; }
.cm-s-default .cm-string   { color: #c3e88d; }
.cm-s-default .cm-string-2 { color: #c3e88d; }
.cm-s-default .cm-comment  { color: var(--text-3); font-style: italic; }
.cm-s-default .cm-builtin  { color: #ffcb6b; }
.cm-s-default .cm-meta     { color: #ffcb6b; }
.cm-s-default .cm-atom     { color: #f78c6c; }
.cm-s-default .cm-tag      { color: #f07178; }
.cm-s-default .cm-attribute{ color: #ffcb6b; }
html[data-theme="light"] .cm-s-default .cm-keyword { color: #7c3aed; }
html[data-theme="light"] .cm-s-default .cm-def     { color: #2563eb; }
html[data-theme="light"] .cm-s-default .cm-string  { color: #059669; }
html[data-theme="light"] .cm-s-default .cm-number  { color: #d97706; }
html[data-theme="light"] .cm-s-default .cm-comment { color: #94a3b8; }
html[data-theme="light"] .cm-s-default .cm-builtin { color: #b45309; }

/* TERMINAL PANEL */
.term-panel {
  display: flex;
  flex-direction: column;
  background: var(--term-bg);
  border-top: 1px solid var(--border);
  height: 280px;
  min-height: 90px;
  max-height: 70vh;
}
.term-resizer {
  height: 5px;
  cursor: ns-resize;
  background: transparent;
  margin-top: -5px;
  position: relative;
  z-index: 5;
}
.term-resizer:hover { background: var(--accent-soft); }
.term-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  height: 32px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: .06em;
  flex-shrink: 0;
}
.term-header .term-tabs { display: flex; gap: 2px; text-transform: none; letter-spacing: 0; }
.term-tab {
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
  cursor: pointer;
  transition: background .1s, color .1s;
}
.term-tab:hover { background: var(--bg-hover); color: var(--text); }
.term-tab.active { background: var(--bg-active); color: var(--text); }
.term-header .spacer { flex: 1; }
.term-actions { display: flex; gap: 2px; }
.term-actions .icon-btn { width: 24px; height: 24px; color: var(--text-3); }
.term-actions .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

.term-body { flex: 1; min-height: 0; position: relative; }
#xterm { width: 100%; height: 100%; padding: 6px 4px; }

/* Output pane (pestaña "Salida") */
#outputPane {
  position: absolute; inset: 0;
  overflow-y: auto;
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
  color: #d4d9e3;
  white-space: pre-wrap;
  word-break: break-word;
}
#outputPane .out-head { color: #60a5fa; font-weight: 700; margin: 10px 0 4px; }
#outputPane .out-head:first-child { margin-top: 0; }
#outputPane .out-line { color: #d4d9e3; }
#outputPane .out-err  { color: #f87171; }
#outputPane .out-sys  { color: #8b93a5; font-style: italic; }

/* ============================================================
   STATUS BAR
   ============================================================ */
.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-2);
}
.status-item { display: flex; align-items: center; gap: 6px; }
.status-item svg { width: 12px; height: 12px; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); flex-shrink: 0;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
.status-dot.busy   { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.statusbar .spacer { flex: 1; }
.statusbar .cursor-pos { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }

/* ============================================================
   TOASTS
   ============================================================ */
#toasts {
  position: fixed;
  bottom: 40px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 1000;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  color: var(--text);
  min-width: 260px;
  max-width: 380px;
  pointer-events: auto;
  animation: toast-in .25s cubic-bezier(.2,.9,.4,1);
}
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } }
.toast.leaving { animation: toast-out .2s forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast.success { border-left-color: var(--success); }
.toast.success svg { color: var(--success); }
.toast.error   { border-left-color: var(--danger); }
.toast.error svg { color: var(--danger); }
.toast.warn    { border-left-color: var(--warn); }
.toast.warn svg { color: var(--warn); }
.toast.info    svg { color: var(--accent); }

/* ============================================================
   MODALS / OVERLAYS
   ============================================================ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

<script>
/* ============================================================================
   EspWebStudio v1.0.2 — IDE MicroPython para ESP32
   ---------------------------------------------------------------------------
   100% cliente. Sin backend. Web Serial API + CodeMirror 5 + xterm.js.
   Licencia: MIT
   ============================================================================ */
(() => {
"use strict";

/* ============================================================================
   1. UTILIDADES GENERALES
   ============================================================================ */
const $  = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function refreshIcons() { if (window.lucide) lucide.createIcons(); }

/* ---------- Toasts ---------- */
const ICONS_TOAST = { success:'check-circle-2', error:'alert-circle', warn:'alert-triangle', info:'info' };
function toast(message, kind='info', timeout=3200) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<i data-lucide="${ICONS_TOAST[kind] || 'info'}"></i><div style="flex:1;">${escapeHtml(message)}</div>`;
  $('#toasts').appendChild(el);
  refreshIcons();
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, timeout);
}

/* ---------- Modal helpers ---------- */
function openOverlay(id)  { $('#'+id).classList.remove('hidden'); }
function closeOverlay(id) { $('#'+id).classList.add('hidden'); }
$$('[data-close]').forEach(b => b.addEventListener('click', () => closeOverlay(b.dataset.close)));
$$('.overlay').forEach(ov => ov.addEventListener('click', e => {
  if (e.target === ov) ov.classList.add('hidden');
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.overlay').forEach(o => o.classList.add('hidden'));
});

/* ============================================================================
   2. CONFIGURACIÓN PERSISTENTE
   ============================================================================ */
const DEFAULT_SETTINGS = {
  theme: 'dark',
  fontSize: 13.5,
  tabSize: 4,
  baud: 115200,
  autocomplete: true,
  lineNumbers: true,
  wordWrap: false,
  autoReconnect: true,
};
const SETTINGS_KEY = 'espwebstudio.settings';

function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') }; }
  catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

let settings = loadSettings();

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  settings.theme = theme;
  saveSettings(settings);
  const icon = theme === 'dark' ? 'moon' : 'sun';
  $('#btnTheme').innerHTML = `<i data-lucide="${icon}"></i>`;
  refreshIcons();
}
applyTheme(settings.theme);

/* ============================================================================
   3. SERIAL MANAGER
   ============================================================================ */
class SerialManager {
  constructor() {
    this.port = null;
    this.writer = null;
    this.reader = null;
    this.connected = false;
    this.mode = 'idle';           // 'idle' | 'terminal' | 'raw'
    this.rawBuffer = '';
    this.rawResolver = null;
    this.rawRejecter = null;
    this.rawTimer = null;
    this.listeners = { data: [], state: [] };
  }
  on(evt, fn) { (this.listeners[evt] ||= []).push(fn); return this; }
  emit(evt, payload) { (this.listeners[evt] || []).forEach(f => f(payload)); }

  async connect() {
    if (this.connected) return;
    this.port = await navigator.serial.requestPort();
    await this._openPort();
  }
  async reconnect(port) {
    this.port = port;
    await this._openPort();
  }
  async _openPort() {
    await this.port.open({ baudRate: settings.baud });
    this.writer = this.port.writable.getWriter();
    this.reader = this.port.readable.getReader();
    this.connected = true;
    this.mode = 'terminal';
    this.emit('state', { connected: true });
    this._readLoop();
  }
  async disconnect() {
    if (!this.connected) return;
    this.connected = false;
    try { this._rejectRaw(new Error('Desconectado')); } catch {}
    try { await this.writer.write(enc.encode('\x02')); } catch {}
    try { await this.reader?.cancel(); } catch {}
    try { await this.reader?.releaseLock(); } catch {}
    try { await this.writer?.releaseLock(); } catch {}
    try { await this.port?.close(); } catch {}
    this.writer = this.reader = this.port = null;
    this.mode = 'idle';
    this.emit('state', { connected: false });
  }

  async write(str) {
    if (!this.writer) return;
    await this.writer.write(enc.encode(str));
  }

  async _readLoop() {
    try {
      while (this.connected) {
        const { value, done } = await this.reader.read();
        if (done) break;
        if (value) this._handleData(dec.decode(value, { stream: true }));
      }
    } catch { /* puerto desconectado físicamente */ }
    if (this.connected) {
      this.connected = false;
      this.mode = 'idle';
      this.emit('state', { connected: false, unexpected: true });
    }
  }

  _handleData(text) {
    if (this.mode === 'raw') {
      this.rawBuffer += text;
      const end = this.rawBuffer.indexOf('\x04>');
      if (end !== -1) {
        const payload = this.rawBuffer.slice(0, end);
        this.rawBuffer = '';
        const split = payload.indexOf('\x04');
        let stdout = split >= 0 ? payload.slice(0, split) : payload;
        const stderr = split >= 0 ? payload.slice(split + 1) : '';
        // El firmware confirma el Ctrl-D con "OK" PEGADO a la salida
        // (documentado en MicroPython: "The Ctrl-D will be acknowledged
        // by 'OK'"). Ej. real: "OKHola Mundo\r\n". Lo descartamos.
        if (stdout.startsWith('OK') && !stdout.startsWith('OK\r') && !stdout.startsWith('OK\n')) {
          stdout = stdout.slice(2);
        }
        clearTimeout(this.rawTimer);
        this.rawTimer = null;
        const resolve = this.rawResolver;
        this.rawResolver = this.rawRejecter = null;
        this.mode = 'terminal';
        this.write('\x02');   // volver al REPL "friendly"
        resolve?.({ stdout, stderr });
      }
    } else {
      this.emit('data', text);
    }
  }

  _rejectRaw(err) {
    if (this.rawTimer) { clearTimeout(this.rawTimer); this.rawTimer = null; }
    const reject = this.rawRejecter;
    this.rawResolver = this.rawRejecter = null;
    this.rawBuffer = '';
    if (this.mode === 'raw') this.mode = 'terminal';
    reject?.(err);
  }

  /* Aborta una ejecución en curso (Raw REPL) y devuelve el control al REPL. */
  async abortRaw() {
    if (this.mode !== 'raw') return;
    this.write('\x02');       // Ctrl-B: salir de Raw REPL
    await sleep(60);
    this.write('\x03');       // Ctrl-C: interrumpir el programa
    this._rejectRaw(new Error('Ejecución interrumpida por el usuario'));
  }

  async rawExec(code, timeoutMs = 8000) {
    if (!this.connected) throw new Error('Sin conexión');
    if (this.mode === 'raw') { await this.write('\x02'); await sleep(80); }

    this.mode = 'raw';
    this.rawBuffer = '';
    await this.write('\x01');     // Ctrl-A → Raw REPL

    const t0 = Date.now();
    while (Date.now() - t0 < 2500) {
      if (this.rawBuffer.includes('raw REPL') && this.rawBuffer.includes('>')) break;
      await sleep(10);
    }
    // Drenar bytes rezagados del banner (prompt partido en varios chunks)
    let lastLen = -1;
    const t1 = Date.now();
    while (Date.now() - t1 < 300) {
      await sleep(30);
      if (this.rawBuffer.length === lastLen) break;
      lastLen = this.rawBuffer.length;
    }
    this.rawBuffer = '';

    return new Promise((resolve, reject) => {
      this.rawResolver = resolve;
      this.rawRejecter = reject;
      this.rawTimer = setTimeout(() => {
        this._rejectRaw(new Error('Tiempo de espera agotado (Raw REPL)'));
      }, timeoutMs);
      this.write(code + '\x04');  // código + Ctrl-D
    });
  }

  async interrupt()  { if (this.connected) await this.write('\x03'); }
  async softReset()  {
    if (!this.connected) return;
    await this.write('\x03'); await sleep(80);
    await this.write('\x03'); await sleep(80);
    await this.write('\x04'); await sleep(150);
    await this.write('\x02');     // asegurar REPL friendly
  }
}

function microPythonHint(editor) {
  const cur = editor.getCursor();
  const token = editor.getTokenAt(cur);
  const word = (token.string || '').replace(/^[^A-Za-z0-9_]+/, '');
  const start = token.start + (token.string.length - word.length);
  const list = new Set([...MP_KEYWORDS, ...MP_BUILTINS, ...MP_MODULES, ...MP_API]);
  const localWords = (editor.getValue().match(/[A-Za-z_][A-Za-z0-9_]{2,}/g) || []);
  localWords.forEach(w => list.add(w));
  const result = [...list]
    .filter(w => w.toLowerCase().startsWith(word.toLowerCase()) && w !== word)
    .sort()
    .slice(0, 40)
    .map(w => ({ text: w, displayText: w }));
  return { list: result, from: CodeMirror.Pos(cur.line, start), to: CodeMirror.Pos(cur.line, cur.ch) };
}
CodeMirror.registerHelper('hint', 'python', microPythonHint);

const state = {
  docs: [],
  activeId: null,
  deviceFiles: [],
  running: false,
  cwd: '/',

function newDoc(name=null, content='', isLocal=true) {
  const doc = {
    id: 'doc_' + Math.random().toString(36).slice(2, 10),
    name, content, dirty: false, isLocal,
  };
  state.docs.push(doc);
  activateDoc(doc.id);
  renderTabs();
  return doc;
}

function activeDoc() { return state.docs.find(d => d.id === state.activeId) || null; }

function activateDoc(id) {
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  const prev = activeDoc();
  if (prev && prev.id !== id) prev.content = cm.getValue();

  state.activeId = id;
  cm.setValue(doc.content || '');
  cm.clearHistory();
  cm.setCursor(0, 0);
  doc.dirty = false;
  renderTabs();
  updateEditorMode();
  if (!doc.isLocal) highlightActiveFile(doc.devicePath || doc.name);
}

function closeDoc(id) {
  const idx = state.docs.findIndex(d => d.id === id);
  if (idx === -1) return;
  const doc = state.docs[idx];
  if (doc.dirty) {
    if (!confirm(`"${doc.name || 'Sin título'}" tiene cambios sin guardar. ¿Cerrar de todas formas?`)) return;
  }
  state.docs.splice(idx, 1);
  if (state.activeId === id) {
    const next = state.docs[idx] || state.docs[idx - 1];
    if (next) activateDoc(next.id);
    else { state.activeId = null; newDoc(); }
  }
  renderTabs();
}

function renderTabs() {
  const bar = $('#tabsBar');
  bar.innerHTML = '';
  state.docs.forEach(doc => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (doc.id === state.activeId ? ' active' : '') + (doc.dirty ? ' dirty' : '');
    tab.title = doc.isLocal ? `${doc.name || 'Sin título'} (local)` : `${doc.name} (en la placa)`;
    tab.innerHTML = `
      <span class="tab-dot"></span>
      <span class="tab-name">${escapeHtml(doc.name || 'Sin título')}</span>
      <span class="tab-close"><i data-lucide="x"></i></span>`;
    tab.addEventListener('click', e => {
      if (e.target.closest('.tab-close')) { closeDoc(doc.id); return; }
      activateDoc(doc.id);
    });
    tab.addEventListener('auxclick', e => { if (e.button === 1) closeDoc(doc.id); });
    bar.appendChild(tab);
  });
  refreshIcons();
}

cm.on('change', () => {
  const doc = activeDoc();
  if (!doc) return;
  const val = cm.getValue();
  if (!doc.dirty && val !== doc.content) {
    doc.dirty = true;
    renderTabs();
  }
});

function updateEditorMode() {
  const doc = activeDoc();
  const name = ((doc && doc.name) || '').toLowerCase();
  let mode = 'python';
  if (name.endsWith('.json')) mode = 'javascript';
  else if (name.endsWith('.md')) mode = 'markdown';
  else if (name.endsWith('.html') || name.endsWith('.htm')) mode = 'htmlmixed';
  else if (name.endsWith('.css')) mode = 'css';
  else if (name.endsWith('.js')) mode = 'javascript';
  else if (name.endsWith('.xml')) mode = 'xml';
  if (!CodeMirror.modes[mode]) mode = 'python';
  cm.setOption('mode', mode);
  $('#editorMode').textContent = mode === 'htmlmixed' ? 'HTML' : mode[0].toUpperCase() + mode.slice(1);
}

const pyStr = (s) => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

function formatKB(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
  return Math.round(bytes / 1024) + ' KB';
}

async function syncFilesystem(silent=false) {
  if (!serial.connected) return;
  try {
    const code =
      "import os, json\n" +
      `cwd = '${pyStr(state.cwd)}'\n` +
      "res = []\n" +
      "try:\n" +
      "    for n in sorted(os.listdir(cwd)):\n" +
      "        p = (cwd if cwd.endswith('/') else cwd + '/') + n\n" +
      "        try:\n" +
      "            mode = os.stat(p)[0]\n" +
      "            isdir = 1 if (mode & 0o170000) == 0o040000 else 0\n" +
      "        except Exception:\n" +
      "            isdir = 0\n" +
      "        res.append([n, isdir])\n" +
      "except Exception:\n" +
      "    pass\n" +
      "print(json.dumps(res))\n" +
      "try:\n" +
      "    s = os.statvfs(cwd)\n" +
      "    print('FS:%d:%d' % (s[0]*s[3], s[0]*s[2]))\n" +
      "except Exception:\n" +
      "    pass\n";
    const { stdout } = await serial.rawExec(code, 5000);
    const m = stdout.match(/\[[\s\S]*\]/);
    let files = [];
    try { files = m ? JSON.parse(m[0]) : []; } catch { files = []; }
    if (!Array.isArray(files)) files = [];
    state.deviceFiles = files;
    renderFileList(files);

    const fsm = stdout.match(/FS:(\d+):(\d+)/);
    const loc = state.cwd;
    $('#fsInfo').textContent = fsm
      ? `${loc} · ${files.length} elem · ${formatKB(+fsm[1])} libres de ${formatKB(+fsm[2])}`
      : `${loc} · ${files.length} elemento(s)`;
    if (!silent) toast(`Explorador actualizado: ${files.length} elemento(s)`, 'info', 2000);
  } catch (e) {
    console.warn('syncFilesystem:', e);
    if (!silent) toast('Error listando archivos: ' + e.message, 'error');
  }
}

function joinPath(cwd, name) { return cwd === '/' ? `/${name}` : `${cwd}${name}`; }

function navTo(name) {
  if (name === '..') {
    const parts = state.cwd.split('/').filter(Boolean);
    parts.pop();
    state.cwd = parts.length ? '/' + parts.join('/') + '/' : '/';
  } else {
    state.cwd = state.cwd === '/' ? `/${name}/` : `${state.cwd}${name}/`;
  }
  syncFilesystem(true);
}

function renderFileList(files) {
  const list = $('#fileList');
  list.innerHTML = '';
  if (!files.length && state.cwd === '/') {
    list.innerHTML = `
      <div class="empty-state">
        <i data-lucide="folder-open"></i>
        <div>Almacenamiento vacío.<br>Crea un nuevo archivo con «Nuevo».</div>
      </div>`;
    refreshIcons();
    return;
  }
  const items = [...files];
  if (state.cwd !== '/') items.unshift(['..', 1]);
  if (!files.length) {
    const note = document.createElement('div');
    note.style.cssText = 'padding:6px 12px; font-size:11.5px; color:var(--text-3);';
    note.textContent = 'Carpeta vacía';
    list.appendChild(note);
  }
  items.forEach(([name, isDir]) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.name = name;
    const fullPath = name === '..' ? null : joinPath(state.cwd, name);
    if (fullPath) item.dataset.path = fullPath;
    item.innerHTML = `
      <i data-lucide="${isDir ? 'folder' : 'file-code-2'}" class="file-icon"></i>
      <span class="file-name">${escapeHtml(name)}</span>
      ${isDir ? '' : `
      <span class="file-more">
        <button class="icon-btn" data-act="download" title="Descargar al PC"><i data-lucide="download"></i></button>
        <button class="icon-btn" data-act="rename"   title="Renombrar"><i data-lucide="pen-line"></i></button>
        <button class="icon-btn" data-act="delete"   title="Eliminar"><i data-lucide="trash-2"></i></button>
      </span>`}`;
    item.addEventListener('click', e => {
      if (isDir) { navTo(name); return; }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'delete')   { e.stopPropagation(); purgeFile(fullPath); return; }
      if (act === 'rename')   { e.stopPropagation(); promptRename(fullPath); return; }
      if (act === 'download') { e.stopPropagation(); downloadFile(fullPath); return; }
      openRemoteFile(fullPath);
    });
    if (!isDir) {
      item.addEventListener('contextmenu', e => {
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, fullPath);
      });
    }
    list.appendChild(item);
  });
  refreshIcons();
}

function highlightActiveFile(path) {
  $$('.file-item').forEach(el => el.classList.toggle('active', el.dataset.path === path));
}

async function openRemoteFile(path) {
  const base = path.split('/').pop();
  const existing = state.docs.find(d => !d.isLocal && d.devicePath === path);
  if (existing) { activateDoc(existing.id); return; }

  setBusy(true);
  try {
    const code =
      "import ubinascii\n" +
      `f = open('${pyStr(path)}', 'rb')\n` +
      "data = f.read()\n" +
      "f.close()\n" +
      "print(ubinascii.b2a_base64(data).decode())\n";
    const { stdout, stderr } = await serial.rawExec(code, 8000);
    if (stderr && stderr.trim()) throw new Error(stderr.trim());
    const b64 = (stdout.trim().split('\n').pop() || '').trim();
    const content = b64 ? base64ToText(b64) : '';
    const doc = newDoc(base, content, false);
    doc.devicePath = path;
  } catch (e) {
    toast('Error abriendo archivo: ' + e.message, 'error');
  } finally {
    setBusy(false);
  }
}

async function purgeFile(path) {
  const base = path.split('/').pop();
  if (!confirm(`¿Eliminar definitivamente "${base}" de la placa?`)) return;
  setBusy(true);
  try {
    await serial.rawExec(
      `import os\ntry:\n    os.remove('${pyStr(path)}')\nexcept Exception:\n    os.rmdir('${pyStr(path)}')\n`,
      4000
    );
    const doc = state.docs.find(d => !d.isLocal && d.devicePath === path);
    if (doc) { doc.dirty = false; closeDoc(doc.id); }
    await syncFilesystem(true);
    toast(`"${base}" eliminado`, 'success');
  } catch (e) {
    toast('Error eliminando: ' + e.message, 'error');
  } finally { setBusy(false); }
}

async function downloadFile(path) {
  const base = path.split('/').pop();
  try {
    const code =
      "import ubinascii\n" +
      `f = open('${pyStr(path)}', 'rb')\n` +
      "data = f.read()\nf.close()\n" +
      "print(ubinascii.b2a_base64(data).decode())\n";
    const { stdout } = await serial.rawExec(code, 8000);
    const b64 = (stdout.trim().split('\n').pop() || '').trim();
    const blob = new Blob([base64ToBytes(b64)], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: base });
    a.click();
    URL.revokeObjectURL(url);
    toast(`Descargado: ${base}`, 'success');
  } catch (e) {
    toast('Error descargando: ' + e.message, 'error');
  }
}

/* ---------- Guardar en la placa ---------- */
async function saveActiveToDevice() {
  const doc = activeDoc();
  if (!doc) return;
  if (!doc.name) { toast('Este documento no tiene nombre. Usa «Guardar como» (Ctrl+Shift+S).', 'warn'); return; }
  if (!serial.connected) { toast('Conecta la placa primero', 'warn'); return; }

  const target = doc.devicePath || joinPath(state.cwd, doc.name);
  doc.content = cm.getValue();
  setBusy(true, `Guardando ${doc.name}…`);
  try {
    const b64 = bytesToBase64(enc.encode(doc.content));
    const CHUNK = 400;
    let py = "import ubinascii\nb64 = ''\n";
    for (let i = 0; i < b64.length; i += CHUNK) py += `b64 += '${b64.slice(i, i + CHUNK)}'\n`;
    py += "try:\n";
    py += "    data = ubinascii.a2b_base64(b64)\n";
    py += `    f = open('${pyStr(target)}', 'wb')\n`;
    py += "    f.write(data)\n    f.close()\n    print('OK')\n";
    py += "except Exception as e:\n    print('ERR:' + str(e))\n";

    const { stdout, stderr } = await serial.rawExec(py, 30000);
    if (stdout.includes('ERR:') || (stderr && stderr.trim()) || !stdout.includes('OK')) {
      throw new Error((stdout.match(/ERR:(.*)/)?.[1] || stderr || 'Error desconocido').trim());
    }
    doc.dirty = false;
    doc.isLocal = false;
    doc.devicePath = target;
    renderTabs();
    updateEditorMode();
    toast(`"${doc.name}" guardado en la placa`, 'success');
    await syncFilesystem(true);
    highlightActiveFile(target);
  } catch (e) {
    toast('Error guardando: ' + e.message, 'error', 5000);
  } finally {
    setBusy(false);
  }
}

/* ---------- Ejecutar en RAM (Raw REPL, salida capturada) ---------- */
async function runInRam() {
  if (!serial.connected) { toast('Conecta la placa primero', 'warn'); return; }
  if (state.running) { toast('Ya hay una ejecución en curso', 'warn'); return; }
  const doc = activeDoc();
  let code = cm.getValue();
  if (!code.trim()) { toast('El editor está vacío', 'warn'); return; }
  if (!code.endsWith('\n')) code += '\n';

  state.running = true;
  setBusy(true, 'Ejecutando…');
  updateStatusBar();
  switchTermTab('output');
  logOutput(`▸ ${doc?.name || 'Sin título'} — ${new Date().toLocaleTimeString()}`, 'head');

  try {
    await serial.write('\x03');           // interrumpir ejecución previa
    await sleep(150);
    const { stdout, stderr } = await serial.rawExec(code, 120000);
    if (stdout) logOutput(stdout.replace(/\n$/, ''), 'line');
    if (stderr && stderr.trim()) logOutput(stderr.trim(), 'err');
    if (!stdout && !(stderr && stderr.trim())) logOutput('(sin salida)', 'sys');
  } catch (e) {
    logOutput('✗ ' + e.message, 'err');
    try { await serial.write('\x03'); } catch {}
  } finally {
    state.running = false;
    setBusy(false);
    updateStatusBar();
  }
}

/* ============================================================================
   9. BINARY / BASE64 HELPERS
   ============================================================================ */
function bytesToBase64(bytes) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function base64ToBytes(b64) {
  const bin = atob(b64.replace(/\s+/g, ''));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function base64ToText(b64) { return dec.decode(base64ToBytes(b64)); }

$('#btnConnect').addEventListener('click', async () => {
  if (serial.connected) {
    await serial.disconnect();
    toast('Desconectado', 'info');
    return;
  }
  if (!('serial' in navigator)) {
    toast('Tu navegador no soporta Web Serial API. Usa Chrome o Edge en escritorio.', 'error', 6000);
    return;
  }
  try {
    await serial.connect();
    toast('Placa conectada', 'success');
    term.clear();
    term.writeln('\x1b[1;32m✓ Conectado a la placa\x1b[0m\r\n');
    await sleep(400);
    await serial.write('\x03'); await sleep(120);
    await serial.write('\x03'); await sleep(250);

    // Detectar chip y versión de MicroPython
    try {
      const info = await serial.rawExec(
        "import sys, os\n" +
        "u = os.uname()\n" +
        "print('CHIP:' + u.machine)\n" +
        "print('VER:' + u.version.split(' on ')[0].replace('MicroPython ', ''))\n",
        4000
      );
      const chip = info.stdout.match(/CHIP:(.+)/)?.[1]?.trim();
      const ver  = info.stdout.match(/VER:(.+)/)?.[1]?.trim();
      if (chip) $('#chipText').textContent = chip;
      if (ver)  $('#versionText').textContent = 'MP ' + ver;
    } catch { /* no crítico */ }

    await syncFilesystem(true);
  } catch (e) {
    if (e.name === 'NotFoundError') toast('No se seleccionó ningún puerto', 'warn');
    else if (e.name === 'NetworkError') toast('No se pudo abrir el puerto. Cierra otros programas que lo usen (ej. Thonny) y reintenta.', 'error', 6000);
    else toast('Error conectando: ' + e.message, 'error');
    if (!serial.connected) updateStatusBar();
  }
});

let cmdSelectedIdx = 0;
let cmdFiltered = [...COMMANDS];

function openCommandPalette() {
  cmdSelectedIdx = 0;
  cmdFiltered = [...COMMANDS];
  $('#cmdInput').value = '';
  renderCommandList();
  openOverlay('cmdOverlay');
  setTimeout(() => $('#cmdInput').focus(), 30);
}
$('#btnCommand').addEventListener('click', openCommandPalette);

function renderCommandList() {
  const list = $('#cmdList');
  list.innerHTML = '';
  if (!cmdFiltered.length) {
    list.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-3); font-size:13px;">Sin resultados</div>`;
    return;
  }
  cmdFiltered.forEach((cmd, i) => {
    const el = document.createElement('div');
    el.className = 'cmd-item' + (i === cmdSelectedIdx ? ' selected' : '');
    el.innerHTML = `<i data-lucide="${cmd.icon}"></i><span>${cmd.label}</span>` +
                   (cmd.key ? `<span class="cmd-key">${cmd.key}</span>` : '');
    el.addEventListener('click', () => { closeOverlay('cmdOverlay'); cmd.run(); });
    el.addEventListener('mousemove', () => {
      if (cmdSelectedIdx !== i) { cmdSelectedIdx = i; renderCommandList(); }
    });
    list.appendChild(el);
  });
  refreshIcons();
}
$('#cmdInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  cmdFiltered = COMMANDS.filter(c => c.label.toLowerCase().includes(q));
  cmdSelectedIdx = 0;
  renderCommandList();
});
$('#cmdInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, cmdFiltered.length - 1);
    renderCommandList();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0);
    renderCommandList();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const cmd = cmdFiltered[cmdSelectedIdx];
    if (cmd) { closeOverlay('cmdOverlay'); cmd.run(); }
  }
});

document.addEventListener('keydown', e => {
  const inEditor = e.target.closest('.CodeMirror');
  const inInput = e.target.closest('input, textarea, select');
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
    e.preventDefault(); openCommandPalette(); return;
  }
  if (mod && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
    e.preventDefault(); applyTheme(settings.theme === 'dark' ? 'light' : 'dark'); return;
  }
  if (mod && e.key === ',') { e.preventDefault(); openSettings(); return; }
  if (!inEditor && !inInput && e.key === '?' && !mod) { e.preventDefault(); openShortcuts(); return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#btnConnect').click(); return; }
  if (e.key === 'F5') { e.preventDefault(); runInRam(); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveActiveToDevice(); return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveActiveAs(); return;
  }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); newFile(); return; }
  if (mod && e.key.toLowerCase() === 'w') {
    if (state.docs.length) { e.preventDefault(); closeDoc(state.activeId); }
    return;
  }
  if (mod && e.key.toLowerCase() === 'r' && !inEditor) {
    e.preventDefault(); serial.softReset(); return;
  }
});

/* ============================================================================
   17. REDIMENSIONAR TERMINAL
   ============================================================================ */
(function termResize() {
  const handle = $('#termResizer');
  const panel  = $('#termPanel');
  let dragging = false, startY = 0, startH = 0;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    startY = e.clientY;
    startH = panel.offsetHeight;
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'ns-resize';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = startY - e.clientY;
    const newH = Math.max(90, Math.min(window.innerHeight - 200, startH + delta));
    panel.style.height = newH + 'px';
    fitAddon.fit();
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });
})();

/* ============================================================================
   18. ANTES DE CERRAR LA PÁGINA
   ============================================================================ */
window.addEventListener('beforeunload', e => {
  if (state.docs.some(d => d.dirty)) {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ============================================================================
   19. AUTO-RECONNECT (Web Serial getPorts)
   ============================================================================ */
(async function tryAutoReconnect() {
  if (!('serial' in navigator)) {
    if (!window.location.protocol.startsWith('http')) return;
    toast('Tu navegador no soporta Web Serial API. Usa Chrome o Edge en escritorio.', 'warn', 6000);
    return;
  }
  if (!settings.autoReconnect) return;
  try {
    const ports = await navigator.serial.getPorts();
    if (ports.length) {
      const ok = confirm('Se encontró una placa previamente autorizada. ¿Reconectar?');
      if (ok) {
        await serial.reconnect(ports[0]);
        toast('Reconectado', 'success');
        await sleep(400);
        await serial.write('\x03'); await sleep(200);
        await syncFilesystem(true);
      }
    }
  } catch { /* ignore */ }
})();

/* ============================================================================
   20. ARRANQUE + PWA
   ============================================================================ */
function boot() {
  sidebarDisconnected();
  newDoc('main.py', '', true);
  updateStatusBar();
  refreshIcons();

  const savedH = localStorage.getItem('espwebstudio.termH');
  if (savedH) $('#termPanel').style.height = savedH + 'px';
  setTimeout(() => fitAddon.fit(), 60);

  setInterval(() => {
    const h = $('#termPanel').offsetHeight;
    if (h) localStorage.setItem('espwebstudio.termH', String(h));
  }, 1500);

}
boot();

/* API pública para depuración / extensiones */
window.EspWebStudio = { serial, term, cm, state, settings, toast, runInRam, syncFilesystem };

})();
</script>
